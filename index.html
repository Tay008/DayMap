<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DayMap</title>
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('daymap.theme');
        } catch (e) {
          stored = null;
        }
        var theme = stored === 'ink' || stored === 'moss' ? stored : 'paper';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
